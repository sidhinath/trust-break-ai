<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="TrustBreak AI detects, explains, and mitigates phishing, scam messages, malicious links, fake QR codes, and AI voice deepfakes across web, Android, and Chrome." />
    <meta name="application-name" content="TrustBreak AI" />
    <meta name="theme-color" content="#07101d" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrustBreak AI" />
    <meta property="og:title" content="TrustBreak AI — Multi-Modal Cybersecurity & Scam Prevention" />
    <meta property="og:description" content="Explainable, multi-modal scam protection for messages, links, screenshots, QR codes, and voice calls." />
    <meta property="og:url" content="https://trust-break-ai.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TrustBreak AI — Multi-Modal Cybersecurity & Scam Prevention" />
    <meta name="twitter:description" content="Explainable, multi-modal scam protection for messages, links, screenshots, QR codes, and voice calls." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="./manifest.json" />
    <title>TrustBreak AI — Multi-Modal Cybersecurity & Scam Prevention</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07101d;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[TrustBreak Global Error]', e.message, e.filename, e.lineno);
        var errContainer = document.getElementById('trustbreak-fallback-error');
        if (errContainer) {
          errContainer.style.display = 'block';
          errContainer.innerText = 'Notice: ' + (e.message || 'JS Execution Notice');
        }
      });
    </script>
  </head>
  <body class="dark bg-slate-950 text-white antialiased selection:bg-cyan-500/30 selection:text-cyan-400">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07101d; color: #ffffff; padding: 24px; text-align: center; box-sizing: border-box;">
        <div style="width: 72px; height: 72px; border-radius: 20px; background-color: #0284c7; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 40px rgba(2, 132, 199, 0.4); border: 2px solid rgba(56, 189, 248, 0.4);">
          <span style="font-weight: 900; font-size: 26px; color: #ffffff; letter-spacing: -1px;">TB</span>
        </div>
        <h1 style="font-weight: 800; margin: 0 0 8px 0; font-size: 22px; color: #ffffff;">TrustBreak Security</h1>
        <p style="color: #94a3b8; font-size: 13px; margin: 0 0 16px 0; font-weight: 500;">Initializing Threat Detection Layer...</p>
        <div id="trustbreak-fallback-error" style="display: none; max-width: 320px; margin-top: 16px; padding: 12px; border-radius: 12px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-size: 11px; text-align: left; word-break: break-word;"></div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
